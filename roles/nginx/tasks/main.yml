- name: Install nginx
  ansible.builtin.package:
    name: nginx
    state: present
  become: true

- name: Create the report web folder
  ansible.builtin.file:
    path: "{{ nginx_report_root }}"
    state: directory
    owner: "{{ nginx_report_owner }}"
    mode: "0755"           
  become: true

- name: Deploy the site config
  ansible.builtin.template:
    src: disk-report.conf.j2
    dest: /etc/nginx/conf.d/disk-report.conf
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: nginx config changed

- name: Make sure nginx is running and starts on boot
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true
  become: true